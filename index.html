<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOLITAIRE</title>
    <link rel="stylesheet" href="./src/style.css">
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>

    <div class="top-section">
      <button>New Game</button>
    </div>

    <div class="board">

      <div class="top-board">
        <div class="stock">
          <playing-card></playing-card>
          <playing-card suit="spade" rank="7"></playing-card>
        </div>
        <div class="waste"></div>
        <div class="empty"></div>
        <div class="heart"></div>
        <div class="spade"></div>
        <div class="diamond"></div>
        <div class="club"></div>
      </div>

      <div class="tableau">
        <div></div>
        <div></div>
        <div></div>
        <div>
          <playing-card flipped></playing-card>
          <playing-card class="first" flipped></playing-card>
          <playing-card class="another" suit="spade" rank="7"></playing-card>
          <playing-card class="another2" suit="heart" rank="2" flipped></playing-card>
        </div>
        <div></div>
        <div></div>
        <div></div>
      </div>

    </div>

  </body>
</html>
